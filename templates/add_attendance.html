<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academic Lens | Add Attendance</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
        }

        /* =========================
           PAGE
        ========================= */

        .attendance-page {
            min-height: 100vh;
            padding: 30px 45px 50px;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(16, 185, 129, 0.10),
                    transparent 35%
                ),
                #f5f7fb;
        }


        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            text-decoration: none;

            color: #334155;
            background: #ffffff;

            padding: 11px 18px;

            border-radius: 10px;

            font-size: 13px;
            font-weight: 700;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 5px 18px rgba(15, 23, 42, 0.06);

            transition: 0.25s;
        }

        .back-btn:hover {
            color: #059669;
            transform: translateX(-3px);
            box-shadow:
                0 8px 22px rgba(15, 23, 42, 0.10);
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .page-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 25px;

            background:
                linear-gradient(
                    135deg,
                    #059669,
                    #10b981
                );

            box-shadow:
                0 12px 28px rgba(16, 185, 129, 0.25);
        }

        .page-heading h1 {
            margin: 0 0 7px;

            font-size: 30px;
            font-weight: 800;

            color: #172033;
        }

        .page-heading p {
            margin: 0;

            color: #64748b;

            font-size: 14px;
        }


        /* =========================
           MAIN CARD
        ========================= */

        .form-card {
            max-width: 900px;

            margin: 0 auto;

            background: #ffffff;

            border-radius: 22px;

            padding: 32px;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 18px 45px rgba(15, 23, 42, 0.08);
        }


        /* =========================
           SECTION
        ========================= */

        .section-title {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-bottom: 22px;

            padding-bottom: 13px;

            border-bottom: 1px solid #e2e8f0;

            color: #1e293b;

            font-size: 16px;

            font-weight: 800;
        }

        .section-title i {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            color: #059669;

            background: #ecfdf5;

            font-size: 14px;
        }


        /* =========================
           FORM GRID
        ========================= */

        .form-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 22px;
        }


        /* =========================
           FORM GROUP
        ========================= */

        .form-group {
            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .form-group label {
            font-size: 12px;

            font-weight: 700;

            color: #475569;
        }


        /* =========================
           INPUT BOX
        ========================= */

        .input-box {
            position: relative;
            width: 100%;
        }

        .input-box i {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 14px;

            pointer-events: none;

            z-index: 2;
        }

        .input-box input,
        .input-box select {

            width: 100%;

            height: 48px;

            padding: 0 14px 0 43px;

            border: 1px solid #dbe2ea;

            border-radius: 11px;

            background: #f8fafc;

            color: #1e293b;

            font-size: 13px;

            outline: none;

            transition: all 0.25s;
        }

        .input-box input::placeholder {
            color: #94a3b8;
        }

        .input-box input:focus,
        .input-box select:focus {

            background: #ffffff;

            border-color: #10b981;

            box-shadow:
                0 0 0 4px rgba(16, 185, 129, 0.10);
        }

        .input-box select {
            cursor: pointer;
        }


        /* =========================
           ATTENDANCE PREVIEW
        ========================= */

        .attendance-preview {

            margin-top: 30px;

            padding: 24px;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #ecfdf5,
                    #f0fdfa
                );

            border: 1px solid #ccefe0;
        }

        .preview-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 18px;
        }

        .preview-title {

            margin-bottom: 5px;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 0.6px;

            color: #64748b;
        }

        .attendance-value {

            font-size: 31px;

            line-height: 1;

            font-weight: 800;

            color: #059669;
        }

        .preview-icon {

            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 13px;

            background: #ffffff;

            color: #059669;

            font-size: 20px;

            box-shadow:
                0 5px 15px rgba(5, 150, 105, 0.10);
        }


        /* =========================
           PROGRESS BAR
        ========================= */

        .progress-track {

            width: 100%;

            height: 10px;

            background: #d1fae5;

            border-radius: 20px;

            overflow: hidden;
        }

        .progress-fill {

            height: 100%;

            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    #059669,
                    #10b981
                );

            border-radius: 20px;

            transition: width 0.35s ease;
        }


        /* =========================
           STATUS
        ========================= */

        .attendance-status {

            margin-top: 13px;

            font-size: 12px;

            font-weight: 700;

            color: #64748b;
        }

        .good {
            color: #059669;
        }

        .warning {
            color: #d97706;
        }

        .danger {
            color: #dc2626;
        }


        /* =========================
           ACTION BUTTONS
        ========================= */

        .actions {

            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 30px;

            padding-top: 24px;

            border-top: 1px solid #e2e8f0;
        }

        .cancel-btn,
        .save-btn {

            min-height: 44px;

            padding: 0 21px;

            border: none;

            border-radius: 10px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            text-decoration: none;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            transition: 0.25s;
        }

        .cancel-btn {

            color: #475569;

            background: #f1f5f9;

            border: 1px solid #e2e8f0;
        }

        .cancel-btn:hover {

            background: #e2e8f0;

            transform: translateY(-1px);
        }

        .save-btn {

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #059669,
                    #10b981
                );

            box-shadow:
                0 7px 18px rgba(16, 185, 129, 0.22);
        }

        .save-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 24px rgba(16, 185, 129, 0.30);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .attendance-page {
                padding: 20px;
            }

            .form-card {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .page-heading h1 {
                font-size: 25px;
            }

            .actions {
                flex-direction: column;
            }

            .cancel-btn,
            .save-btn {
                width: 100%;
            }
        }

    </style>

</head>


<body>


<div class="attendance-page">


    <!-- =========================
         TOP BAR
    ========================= -->

    <div class="topbar">

        <a href="{{ url_for('admin_dashboard') }}"
           class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

            Dashboard

        </a>

    </div>


    <!-- =========================
         PAGE HEADER
    ========================= -->

    <div class="page-heading">

        <div class="heading-icon">

            <i class="fa-solid fa-calendar-check"></i>

        </div>

        <h1>Record Attendance</h1>

        <p>
            Keep student attendance records up to date
        </p>

    </div>


    <!-- =========================
         FORM CARD
    ========================= -->

    <div class="form-card">

        <form method="POST">


            <!-- STUDENT & SUBJECT -->

            <div class="section-title">

                <i class="fa-solid fa-users"></i>

                <span>Student & Subject</span>

            </div>


            <div class="form-grid">


                <!-- STUDENT -->

                <div class="form-group">

                    <label for="student_id">
                        Student
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <select
                            name="student_id"
                            id="student_id"
                            required>

                            <option value="">
                                Select Student
                            </option>

                            {% for student in students %}

                            <option value="{{ student.id }}">

                                {{ student.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <!-- SUBJECT -->

                <div class="form-group">

                    <label for="subject_id">
                        Subject
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-book"></i>

                        <select
                            name="subject_id"
                            id="subject_id"
                            required>

                            <option value="">
                                Select Subject
                            </option>

                            {% for subject in subjects %}

                            <option value="{{ subject.id }}">

                                {{ subject.subject_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

            </div>


            <!-- ATTENDANCE DETAILS -->

            <div class="section-title"
                 style="margin-top: 32px;">

                <i class="fa-solid fa-chart-pie"></i>

                <span>Attendance Details</span>

            </div>


            <div class="form-grid">


                <!-- TOTAL CLASSES -->

                <div class="form-group">

                    <label for="total_classes">
                        Total Classes
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-school"></i>

                        <input
                            type="number"
                            name="total_classes"
                            id="total_classes"
                            min="0"
                            placeholder="e.g. 40"
                            required>

                    </div>

                </div>


                <!-- ATTENDED CLASSES -->

                <div class="form-group">

                    <label for="attended_classes">
                        Attended Classes
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-user-check"></i>

                        <input
                            type="number"
                            name="attended_classes"
                            id="attended_classes"
                            min="0"
                            placeholder="e.g. 36"
                            required>

                    </div>

                </div>

            </div>


            <!-- =========================
                 ATTENDANCE PREVIEW
            ========================= -->

            <div class="attendance-preview">

                <div class="preview-top">

                    <div>

                        <div class="preview-title">
                            ATTENDANCE PREVIEW
                        </div>

                        <div
                            class="attendance-value"
                            id="attendancePercentage">

                            0%

                        </div>

                    </div>


                    <div class="preview-icon">

                        <i class="fa-solid fa-calendar-days"></i>

                    </div>

                </div>


                <div class="progress-track">

                    <div
                        class="progress-fill"
                        id="attendanceProgress">
                    </div>

                </div>


                <div
                    class="attendance-status"
                    id="attendanceStatus">

                    Enter classes to calculate attendance.

                </div>

            </div>


            <!-- =========================
                 ACTIONS
            ========================= -->

            <div class="actions">

                <a
                    href="{{ url_for('admin_dashboard') }}"
                    class="cancel-btn">

                    <i class="fa-solid fa-xmark"></i>

                    Cancel

                </a>


                <button
                    type="submit"
                    class="save-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Attendance

                </button>

            </div>


        </form>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

const totalClasses =
    document.getElementById("total_classes");

const attendedClasses =
    document.getElementById("attended_classes");

const attendancePercentage =
    document.getElementById("attendancePercentage");

const attendanceProgress =
    document.getElementById("attendanceProgress");

const attendanceStatus =
    document.getElementById("attendanceStatus");


function updateAttendance() {

    const total =
        Number(totalClasses.value) || 0;

    let attended =
        Number(attendedClasses.value) || 0;


    /* Prevent attended > total */

    if (attended > total && total > 0) {

        attended = total;

        attendedClasses.value = total;

    }


    /* No data */

    if (total <= 0) {

        attendancePercentage.textContent = "0%";

        attendanceProgress.style.width = "0%";

        attendanceStatus.textContent =
            "Enter classes to calculate attendance.";

        attendanceStatus.className =
            "attendance-status";

        return;
    }


    /* Calculate */

    const percentage =
        (attended / total) * 100;

    const rounded =
        Math.round(percentage);


    attendancePercentage.textContent =
        rounded + "%";


    attendanceProgress.style.width =
        Math.min(percentage, 100) + "%";


    /* Status */

    if (percentage >= 75) {

        attendanceStatus.textContent =
            "✓ Good attendance — above the 75% requirement.";

        attendanceStatus.className =
            "attendance-status good";

    }

    else if (percentage >= 60) {

        attendanceStatus.textContent =
            "⚠ Attendance is below 75%. Improvement recommended.";

        attendanceStatus.className =
            "attendance-status warning";

    }

    else {

        attendanceStatus.textContent =
            "⚠ Low attendance — immediate improvement required.";

        attendanceStatus.className =
            "attendance-status danger";

    }

}


/* Listen for changes */

totalClasses.addEventListener(
    "input",
    updateAttendance
);

attendedClasses.addEventListener(
    "input",
    updateAttendance
);

</script>


</body>

</html>
